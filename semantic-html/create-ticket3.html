<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Исправленная форма</title>
</head>
<body>
  <main>
    <h1>Создать обращение</h1>
    <form action="#" method="post">
      <div>
        <label for="test-select">Тестовый выбор</label>
        <select id="test-select" name="test">
          <option value="test">Тестовый вариант</option>
        </select>
      </div>
      <fieldset>
        <legend>Приоритет</legend>
        <label><input type="radio" name="priority" value="normal" checked> Обычный</label>
        <label><input type="radio" name="priority" value="high"> Высокий</label>
      </fieldset>
      <p>Текст с закрытием</p>
      <div>Следующий блок</div>
      <button type="submit">Отправить</button>
    </form>
  </main>
</body>
</html>
